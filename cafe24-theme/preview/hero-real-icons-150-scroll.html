<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>페르패키지 배너 아래 150px 실사 아이콘 - 가로 탐색형</title>
  <style>
    :root { --navy: #183f83; --ink: #0b2347; --line: #dfe6ee; --soft: #f4f7fa; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--soft); color: var(--ink); font-family: "Pretendard", "Noto Sans KR", system-ui, sans-serif; }
    .pp-demo { max-width: 1600px; margin: 0 auto; padding: 30px 28px 56px; }
    .pp-hero { display: grid; grid-template-columns: minmax(0, 1.12fr) minmax(0, .88fr); gap: 18px; overflow: hidden; }
    .pp-banner { display: grid; min-height: 430px; grid-template-columns: 48% 52%; overflow: hidden; border-radius: 8px; background: #e6f0ff; }
    .pp-banner:nth-child(2) { background: #fff6d7; }
    .pp-banner__copy { display: flex; padding: 44px 30px; flex-direction: column; justify-content: center; }
    .pp-banner__eyebrow { align-self: flex-start; margin: 0 0 18px; padding: 6px 10px; border-radius: 4px; background: rgba(255,255,255,.86); color: var(--navy); font-size: 12px; font-weight: 700; }
    .pp-banner h1 { margin: 0; font-size: clamp(30px, 3.1vw, 47px); line-height: 1.18; }
    .pp-banner p { margin: 19px 0 0; color: #3e557b; font-size: 15px; line-height: 1.75; }
    .pp-banner img { width: 100%; height: 100%; object-fit: cover; }
    .pp-controls { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 22px 0 16px; }
    .pp-controls button { width: 40px; height: 40px; border: 1px solid #d7e0eb; border-radius: 7px; background: #fff; color: var(--navy); font-size: 25px; }
    .pp-controls span { display: block; width: min(560px, 44vw); height: 3px; background: #dce3ec; }
    .pp-controls span::before { display: block; width: 52%; height: 100%; content: ""; background: var(--navy); }
    .pp-icon-area { margin-top: 6px; padding: 30px 0 0; border-top: 1px solid var(--line); }
    .pp-icon-area__heading { display: flex; align-items: end; justify-content: space-between; padding: 0 4px 16px; }
    .pp-icon-area h2 { margin: 0; font-size: 23px; }
    .pp-icon-area p { margin: 7px 0 0; color: #61738e; font-size: 14px; }
    .pp-icon-strip { display: grid; grid-auto-columns: 208px; grid-auto-flow: column; gap: 16px; overflow-x: auto; overflow-y: hidden; padding: 4px 0 12px; scroll-behavior: smooth; scroll-snap-type: x proximity; scrollbar-width: none; }
    .pp-icon-strip::-webkit-scrollbar { display: none; }
    .pp-icon-strip a { display: flex; min-height: 236px; flex-direction: column; align-items: center; justify-content: center; gap: 14px; border: 1px solid var(--line); border-radius: 8px; background: #fff; color: var(--ink); text-decoration: none; }
    .pp-icon-strip__image { display: grid; width: 164px; height: 164px; place-items: center; overflow: visible; }
    .pp-icon-strip__image img { width: 150px; height: 150px; object-fit: contain; transform: scale(1.35); transform-origin: center; }
    .pp-icon-strip__image .ready { transform: scale(1.22); }
    .pp-icon-strip__image .custom { transform: scale(1.5); }
    .pp-icon-strip__image .bag { transform: scale(1.35); }
    .pp-icon-strip strong { position: relative; z-index: 1; margin-top: 8px; font-size: 15px; }
    .pp-icon-strip a { scroll-snap-align: start; }
    .pp-icon-strip-nav { display: flex; align-items: center; justify-content: flex-end; gap: 8px; margin: 0 0 14px; }
    .pp-icon-strip-nav button { width: 38px; height: 38px; border: 1px solid #d7e0eb; border-radius: 7px; background: #fff; color: var(--navy); font-size: 23px; cursor: pointer; }
    .pp-icon-strip-nav button:hover { border-color: #8fa7cf; background: #f5f8ff; }
    .pp-icon-strip-nav button:focus-visible { outline: 3px solid rgba(24, 63, 131, .28); outline-offset: 2px; }
    @media (max-width: 900px) { .pp-demo { padding: 20px; } .pp-hero { grid-template-columns: 1fr; } .pp-banner:nth-child(2) { display: none; } .pp-banner { min-height: 300px; } .pp-icon-strip { overflow-x: auto; scroll-snap-type: x proximity; } .pp-icon-strip a { scroll-snap-align: start; } }
  </style>
</head>
<body>
  <main class="pp-demo">
    <section class="pp-hero" aria-label="메인 배너 미리보기">
      <article class="pp-banner"><div class="pp-banner__copy"><p class="pp-banner__eyebrow">옵션 선택 후 견적 확인</p><h1>패키지를 더<br>쉽게 고르세요</h1><p>단상자, 쇼핑백, 봉투부터 필요한 상품군을 확인해보세요.</p></div><img src="https://ecimg.cafe24img.com/pg1853b44513043087/peerl/web/assets/shop-photos/uploaded-ready-package.jpg" alt=""></article>
      <article class="pp-banner"><div class="pp-banner__copy"><p class="pp-banner__eyebrow">맞춤 패키지 제작</p><h1>브랜드에 맞는<br>구조를 찾으세요</h1><p>싸바리박스와 내부 트레이, 후가공까지 제품 조건에 맞춰 상담합니다.</p></div><img src="https://ecimg.cafe24img.com/pg1853b44513043087/peerl/web/assets/shop-photos/uploaded-premium-package-set.jpg" alt=""></article>
    </section>
    <div class="pp-controls" aria-hidden="true"><button type="button">‹</button><span></span><button type="button">›</button><button type="button">Ⅱ</button></div>
    <section class="pp-icon-area" aria-label="150px 실사 아이콘 가로 탐색형">
      <div class="pp-icon-area__heading"><div><h2>제품군을 선택해보세요</h2><p>기존 기성상품·소량·샘플 바로가기를 제외하고, 150px 실사 아이콘을 가로로 탐색하는 구성입니다.</p></div></div>
      <div class="pp-icon-strip-nav" aria-label="상품군 가로 탐색">
        <button type="button" data-icon-strip-prev aria-label="이전 상품군 보기">‹</button>
        <button type="button" data-icon-strip-next aria-label="다음 상품군 보기">›</button>
      </div>
      <nav class="pp-icon-strip" data-icon-strip aria-label="제품군 바로가기">
        <a href="#box"><span class="pp-icon-strip__image"><img class="ready" src="../assets/icons/real/quick-ready-box.svg" alt=""></span><strong>단박스</strong></a>
        <a href="#custom"><span class="pp-icon-strip__image"><img class="custom" src="../assets/icons/real/quick-custom-made.svg" alt=""></span><strong>맞춤제작</strong></a>
        <a href="#rigid"><span class="pp-icon-strip__image"><img src="../assets/icons/real/quick-rigid-box.svg" alt=""></span><strong>싸바리</strong></a>
        <a href="#bag"><span class="pp-icon-strip__image"><img class="bag" src="../assets/icons/real/quick-shopping-bag.svg" alt=""></span><strong>쇼핑백</strong></a>
        <a href="#card"><span class="pp-icon-strip__image"><img src="../assets/icons/real/quick-business-card.svg" alt=""></span><strong>명함</strong></a>
        <a href="#banner"><span class="pp-icon-strip__image"><img src="../assets/icons/real/quick-banner.svg" alt=""></span><strong>배너</strong></a>
        <a href="#standing"><span class="pp-icon-strip__image"><img src="../assets/icons/real/quick-standing-banner.svg" alt=""></span><strong>현수막</strong></a>
        <a href="#envelope"><span class="pp-icon-strip__image"><img src="../assets/icons/real/quick-envelope.svg" alt=""></span><strong>봉투</strong></a>
        <a href="#sticker"><span class="pp-icon-strip__image"><img src="../assets/icons/real/quick-sticker.svg" alt=""></span><strong>스티커</strong></a>
        <a href="#dust"><span class="pp-icon-strip__image"><img src="../assets/icons/real/quick-dust-bag.svg" alt=""></span><strong>더스트백</strong></a>
      </nav>
    </section>
  </main>
  <script>
    (function () {
      var strip = document.querySelector('[data-icon-strip]');
      var prev = document.querySelector('[data-icon-strip-prev]');
      var next = document.querySelector('[data-icon-strip-next]');
      if (!strip || !prev || !next) return;

      function move(direction) {
        strip.scrollBy({ left: direction * 448, behavior: 'smooth' });
      }

      prev.addEventListener('click', function () { move(-1); });
      next.addEventListener('click', function () { move(1); });
    }());
  </script>
</body>
</html>
