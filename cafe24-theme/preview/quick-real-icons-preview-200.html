<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>페르패키지 200px 실사 아이콘 미리보기</title>
  <style>
    :root { --pp-navy: #173e83; --pp-text: #102342; --pp-line: #e2e7ed; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #fff; color: var(--pp-text); font-family: "Pretendard", "Noto Sans KR", system-ui, sans-serif; }
    .pp-preview { max-width: 1320px; margin: 0 auto; padding: 44px 32px; }
    h1 { margin: 0 0 10px; font-size: 22px; line-height: 1.3; }
    p { margin: 0; color: #62718a; font-size: 14px; line-height: 1.6; }
    .pp-real-icon-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 30px 36px; margin-top: 24px; padding-top: 28px; border-top: 1px solid var(--pp-line); }
    .pp-real-icon-grid a { display: flex; min-height: 288px; flex-direction: column; align-items: center; justify-content: center; gap: 12px; color: var(--pp-text); text-decoration: none; }
    .pp-real-icon-grid__image { display: grid; width: 216px; height: 216px; place-items: center; overflow: visible; }
    .pp-real-icon-grid__image img { display: block; width: 200px; height: 200px; object-fit: contain; transform: scale(1.3); transform-origin: center; }
    .pp-real-icon-grid__image .pp-real-icon--ready { transform: scale(1.18); }
    .pp-real-icon-grid__image .pp-real-icon--custom { transform: scale(1.42); }
    .pp-real-icon-grid__image .pp-real-icon--bag { transform: scale(1.3); }
    .pp-real-icon-grid strong { position: relative; z-index: 1; margin-top: 10px; font-size: 16px; line-height: 1.35; }
    .pp-real-icon-grid a:hover strong { color: var(--pp-navy); }
    .pp-real-icon-grid a:focus-visible { outline: 2px solid var(--pp-navy); outline-offset: 4px; border-radius: 8px; }
    @media (max-width: 900px) { .pp-real-icon-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; } }
    @media (max-width: 520px) { .pp-preview { padding: 28px 20px; } .pp-real-icon-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main class="pp-preview">
    <h1>실사 아이콘 200px 적용 미리보기</h1>
    <p>아이콘 요소를 200px로 키운 비교 화면입니다. 카테고리 메인, 포트폴리오 진입 카드처럼 넓은 콘텐츠 영역에 쓰기 좋은 크기입니다.</p>
    <nav class="pp-real-icon-grid" aria-label="실사 아이콘 200px 미리보기">
      <a href="#box"><span class="pp-real-icon-grid__image"><img class="pp-real-icon--ready" src="../assets/icons/real/quick-ready-box.svg" alt=""></span><strong>단박스</strong></a>
      <a href="#custom"><span class="pp-real-icon-grid__image"><img class="pp-real-icon--custom" src="../assets/icons/real/quick-custom-made.svg" alt=""></span><strong>맞춤제작</strong></a>
      <a href="#rigid"><span class="pp-real-icon-grid__image"><img src="../assets/icons/real/quick-rigid-box.svg" alt=""></span><strong>싸바리</strong></a>
      <a href="#bag"><span class="pp-real-icon-grid__image"><img class="pp-real-icon--bag" src="../assets/icons/real/quick-shopping-bag.svg" alt=""></span><strong>쇼핑백</strong></a>
      <a href="#card"><span class="pp-real-icon-grid__image"><img src="../assets/icons/real/quick-business-card.svg" alt=""></span><strong>명함</strong></a>
      <a href="#banner"><span class="pp-real-icon-grid__image"><img src="../assets/icons/real/quick-banner.svg" alt=""></span><strong>배너</strong></a>
      <a href="#standing"><span class="pp-real-icon-grid__image"><img src="../assets/icons/real/quick-standing-banner.svg" alt=""></span><strong>현수막</strong></a>
      <a href="#envelope"><span class="pp-real-icon-grid__image"><img src="../assets/icons/real/quick-envelope.svg" alt=""></span><strong>봉투</strong></a>
      <a href="#sticker"><span class="pp-real-icon-grid__image"><img src="../assets/icons/real/quick-sticker.svg" alt=""></span><strong>스티커</strong></a>
      <a href="#dust"><span class="pp-real-icon-grid__image"><img src="../assets/icons/real/quick-dust-bag.svg" alt=""></span><strong>더스트백</strong></a>
    </nav>
  </main>
</body>
</html>
