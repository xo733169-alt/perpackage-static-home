<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>페르패키지 배너 아래 150px 실사 아이콘 - 카드형</title>
  <style>
    :root { --navy: #183f83; --ink: #0b2347; --line: #e1e7ef; --soft: #f5f7fa; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--soft); color: var(--ink); font-family: "Pretendard", "Noto Sans KR", system-ui, sans-serif; }
    .pp-demo { max-width: 1600px; margin: 0 auto; padding: 30px 28px 56px; }
    .pp-hero { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 18px; overflow: hidden; }
    .pp-banner { display: grid; min-height: 302px; grid-template-columns: 46% 54%; overflow: hidden; border-radius: 8px; background: #e6f0ff; }
    .pp-banner:nth-child(2) { background: #fff0eb; }
    .pp-banner:nth-child(3) { background: #fff6d7; }
    .pp-banner__copy { display: flex; padding: 35px 26px; flex-direction: column; justify-content: center; }
    .pp-banner__eyebrow { align-self: flex-start; margin: 0 0 16px; padding: 6px 10px; border-radius: 4px; background: rgba(255,255,255,.86); color: var(--navy); font-size: 12px; font-weight: 700; }
    .pp-banner h1 { margin: 0; font-size: clamp(26px, 2.25vw, 39px); line-height: 1.2; letter-spacing: 0; }
    .pp-banner p { margin: 18px 0 0; color: #3e557b; font-size: 14px; line-height: 1.7; }
    .pp-banner img { width: 100%; height: 100%; object-fit: cover; }
    .pp-controls { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 22px 0 12px; }
    .pp-controls button { width: 40px; height: 40px; border: 1px solid #d7e0eb; border-radius: 7px; background: #fff; color: var(--navy); font-size: 25px; }
    .pp-controls span { display: block; width: min(560px, 44vw); height: 3px; background: #dce3ec; }
    .pp-controls span::before { display: block; width: 36%; height: 100%; content: ""; background: var(--navy); }
    .pp-icon-area { margin-top: 12px; padding: 32px; border-radius: 10px; background: #fff; }
    .pp-icon-area h2 { margin: 0 0 6px; font-size: 23px; }
    .pp-icon-area p { margin: 0; color: #61738e; font-size: 14px; }
    .pp-real-grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 20px; margin-top: 25px; }
    .pp-real-grid a { display: flex; min-height: 234px; flex-direction: column; align-items: center; justify-content: center; gap: 16px; border: 1px solid var(--line); border-radius: 8px; background: #fff; color: var(--ink); text-decoration: none; transition: border-color .2s ease, transform .2s ease; }
    .pp-real-grid a:hover { border-color: #9bb2d9; transform: translateY(-3px); }
    .pp-real-grid__image { display: grid; width: 164px; height: 164px; place-items: center; overflow: visible; }
    .pp-real-grid__image img { width: 150px; height: 150px; object-fit: contain; transform: scale(1.35); transform-origin: center; }
    .pp-real-grid__image .ready { transform: scale(1.22); }
    .pp-real-grid__image .custom { transform: scale(1.5); }
    .pp-real-grid__image .bag { transform: scale(1.35); }
    .pp-real-grid strong { position: relative; z-index: 1; margin-top: 8px; font-size: 15px; }
    @media (max-width: 1100px) { .pp-hero { grid-template-columns: 1fr 1fr; } .pp-banner:last-child { display: none; } .pp-real-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
    @media (max-width: 680px) { .pp-demo { padding: 18px; } .pp-hero { grid-template-columns: 1fr; } .pp-banner:not(:first-child) { display: none; } .pp-banner { min-height: 264px; } .pp-icon-area { padding: 22px 16px; } .pp-real-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; } .pp-real-grid a { min-height: 204px; } .pp-real-grid__image { width: 130px; height: 130px; } .pp-real-grid__image img { width: 118px; height: 118px; } }
  </style>
</head>
<body>
  <main class="pp-demo">
    <section class="pp-hero" aria-label="메인 배너 미리보기">
      <article class="pp-banner"><div class="pp-banner__copy"><p class="pp-banner__eyebrow">옵션 선택 후 견적 확인</p><h1>패키지를 더<br>쉽게 고르세요</h1><p>단상자, 쇼핑백, 봉투부터 필요한 상품군을 확인해보세요.</p></div><img src="https://ecimg.cafe24img.com/pg1853b44513043087/peerl/web/assets/shop-photos/uploaded-ready-package.jpg" alt=""></article>
      <article class="pp-banner"><div class="pp-banner__copy"><p class="pp-banner__eyebrow">소량·샘플 상담 가능</p><h1>작은 수량부터<br>시작하세요</h1><p>테스트와 샘플 목적에 맞춰 제작 방향을 안내합니다.</p></div><img src="https://ecimg.cafe24img.com/pg1853b44513043087/peerl/web/assets/shop-photos/uploaded-small-sample.jpg" alt=""></article>
      <article class="pp-banner"><div class="pp-banner__copy"><p class="pp-banner__eyebrow">맞춤 패키지 제작</p><h1>브랜드에 맞는<br>구조를 찾으세요</h1><p>내부 트레이와 후가공까지 제품 조건에 맞춰 상담합니다.</p></div><img src="https://ecimg.cafe24img.com/pg1853b44513043087/peerl/web/assets/shop-photos/uploaded-premium-package-set.jpg" alt=""></article>
    </section>
    <div class="pp-controls" aria-hidden="true"><button type="button">‹</button><span></span><button type="button">›</button><button type="button">Ⅱ</button></div>
    <section class="pp-icon-area" aria-label="150px 실사 아이콘 카드형">
      <h2>제품군을 선택해보세요</h2>
      <p>기존 기성상품·소량·샘플 바로가기는 제외하고, 150px 실사 아이콘으로 구성한 카드형입니다.</p>
      <nav class="pp-real-grid" aria-label="제품군 바로가기">
        <a href="#box"><span class="pp-real-grid__image"><img class="ready" src="../assets/icons/real/quick-ready-box.svg" alt=""></span><strong>단박스</strong></a>
        <a href="#custom"><span class="pp-real-grid__image"><img class="custom" src="../assets/icons/real/quick-custom-made.svg" alt=""></span><strong>맞춤제작</strong></a>
        <a href="#rigid"><span class="pp-real-grid__image"><img src="../assets/icons/real/quick-rigid-box.svg" alt=""></span><strong>싸바리</strong></a>
        <a href="#bag"><span class="pp-real-grid__image"><img class="bag" src="../assets/icons/real/quick-shopping-bag.svg" alt=""></span><strong>쇼핑백</strong></a>
        <a href="#card"><span class="pp-real-grid__image"><img src="../assets/icons/real/quick-business-card.svg" alt=""></span><strong>명함</strong></a>
        <a href="#banner"><span class="pp-real-grid__image"><img src="../assets/icons/real/quick-banner.svg" alt=""></span><strong>배너</strong></a>
        <a href="#standing"><span class="pp-real-grid__image"><img src="../assets/icons/real/quick-standing-banner.svg" alt=""></span><strong>현수막</strong></a>
        <a href="#envelope"><span class="pp-real-grid__image"><img src="../assets/icons/real/quick-envelope.svg" alt=""></span><strong>봉투</strong></a>
        <a href="#sticker"><span class="pp-real-grid__image"><img src="../assets/icons/real/quick-sticker.svg" alt=""></span><strong>스티커</strong></a>
        <a href="#dust"><span class="pp-real-grid__image"><img src="../assets/icons/real/quick-dust-bag.svg" alt=""></span><strong>더스트백</strong></a>
      </nav>
    </section>
  </main>
</body>
</html>
