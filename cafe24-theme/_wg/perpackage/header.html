  <script>
    (function () {
      function buildAllCategoryMenu() {
        var sourceList = document.querySelector(".pp-cafe24-category-nav__list--db");
        var targetGrid = document.querySelector("[data-pp-category-all-grid]");
        var allMenuItem = document.querySelector(".pp-cafe24-category-nav__item--all");
        var latestChildrenByParent = null;
        var categoryLoadPromise = null;
        var categoryLoaded = false;

        if (!sourceList || !targetGrid) return;
        targetGrid.dataset.ppCafe24CategoryDb = "true";

        function getCategoryNumber(link) {
          try {
            return new URL(link.href, window.location.origin).searchParams.get("cate_no");
          } catch (error) {
            return null;
          }
        }

        function getRootCategories() {
          var roots = [];

          Array.prototype.forEach.call(sourceList.children, function (item) {
            var categoryLink = item.querySelector(":scope > a");
            var categoryNo = categoryLink && getCategoryNumber(categoryLink);
            if (!categoryLink || !categoryNo) return;

            roots.push({ item: item, link: categoryLink, cateNo: String(categoryNo) });
          });

          return roots;
        }

        function makeCategoryUrl(cateNo, fallbackLink) {
          try {
            var url = new URL(fallbackLink.href, window.location.origin);
            url.searchParams.set("cate_no", cateNo);
            return url.pathname + url.search;
          } catch (error) {
            return "/product/list.html?cate_no=" + encodeURIComponent(cateNo);
          }
        }

        function makeCategoryLink(category, fallbackLink, depth) {
          var link = document.createElement("a");
          link.href = makeCategoryUrl(String(category.cate_no), fallbackLink);
          link.textContent = category.name;
          link.dataset.ppCategoryDepth = String(depth || 1);
          return link;
        }

        function buildChildMap(categories) {
          var map = {};

          Array.prototype.forEach.call(categories, function (category) {
            if (!category || !category.cate_no || !category.parent_cate_no || !category.name) return;

            var parentNo = String(category.parent_cate_no);
            if (!map[parentNo]) map[parentNo] = [];
            map[parentNo].push(category);
          });

          return map;
        }

        function getCategoryRows(payload) {
          if (Array.isArray(payload)) return payload;
          if (!payload || typeof payload !== "object") return [];

          var keys = ["data", "categories", "category", "aCategory", "subCategories", "sub_categories", "list", "result"];
          for (var index = 0; index < keys.length; index += 1) {
            if (Array.isArray(payload[keys[index]])) return payload[keys[index]];
          }

          return [];
        }

        function normalizeCategoryRows(rows) {
          return rows.map(function (category) {
            if (!category || typeof category !== "object") return null;

            return {
              cate_no: category.cate_no || category.cateNo || category.category_no || category.categoryNo || category.no,
              parent_cate_no: category.parent_cate_no || category.parentCateNo || category.parent_category_no || category.parentCategoryNo || category.parent_no || category.parentNo,
              name: category.name || category.category_name || category.categoryName
            };
          }).filter(function (category) {
            return category && category.cate_no && category.parent_cate_no && category.name;
          });
        }

        function appendAllChildren(section, parentNo, childrenByParent, fallbackLink, depth) {
          var children = childrenByParent[String(parentNo)] || [];

          Array.prototype.forEach.call(children, function (child) {
            section.appendChild(makeCategoryLink(child, fallbackLink, depth));
            appendAllChildren(section, child.cate_no, childrenByParent, fallbackLink, depth + 1);
          });
        }

        function renderAllMenu(roots, childrenByParent) {
          targetGrid.innerHTML = "";

          Array.prototype.forEach.call(roots, function (root) {
            var section = document.createElement("section");
            var heading = document.createElement("h2");
            heading.appendChild(root.link.cloneNode(true));
            section.appendChild(heading);

            appendAllChildren(section, root.cateNo, childrenByParent, root.link, 1);

            targetGrid.appendChild(section);
          });
        }

        function renderTopCategoryMenus(roots, childrenByParent) {
          Array.prototype.forEach.call(roots, function (root) {
            var children = childrenByParent[root.cateNo] || [];
            var existingGeneratedMenu = root.item.querySelector(".pp-cafe24-generated-sub-category");

            if (existingGeneratedMenu) existingGeneratedMenu.remove();
            if (!children.length) return;

            var menu = document.createElement("div");
            var list = document.createElement("ul");
            menu.className = "sub-category pp-cafe24-generated-sub-category";

            Array.prototype.forEach.call(children, function (child) {
              var listItem = document.createElement("li");
              listItem.appendChild(makeCategoryLink(child, root.link, 1));
              list.appendChild(listItem);
            });

            menu.appendChild(list);
            root.item.appendChild(menu);
          });
        }

        function readVisibleSubCategories(roots) {
          var childrenByParent = {};

          Array.prototype.forEach.call(roots, function (root) {
            var links = root.item.querySelectorAll(".sub-category a");
            if (!links.length) return;

            childrenByParent[root.cateNo] = Array.prototype.map.call(links, function (link) {
              return {
                cate_no: getCategoryNumber(link),
                parent_cate_no: root.cateNo,
                name: link.textContent.trim()
              };
            }).filter(function (category) {
              return category.cate_no && category.name;
            });
          });

          return childrenByParent;
        }

        function renderFallback() {
          var roots = getRootCategories();
          renderAllMenu(roots, latestChildrenByParent || readVisibleSubCategories(roots));
        }

        function loadCafe24SubCategories() {
          if (!window.fetch || categoryLoaded) return categoryLoadPromise;
          if (categoryLoadPromise) return categoryLoadPromise;

          categoryLoadPromise = window.fetch("/exec/front/Product/SubCategory", { credentials: "same-origin" })
            .then(function (response) {
              if (!response.ok) throw new Error("Cafe24 category request failed");
              return response.json();
            })
            .then(function (payload) {
              var categories = normalizeCategoryRows(getCategoryRows(payload));
              if (!categories.length) return;

              var roots = getRootCategories();
              var childrenByParent = buildChildMap(categories);
              latestChildrenByParent = childrenByParent;
              renderTopCategoryMenus(roots, childrenByParent);
              renderAllMenu(roots, childrenByParent);
              sourceList.dataset.ppAllMenuReady = "true";
              categoryLoaded = true;
              categoryLoadPromise = null;
            })
            .catch(function () {
              categoryLoadPromise = null;
              renderFallback();
            });

          return categoryLoadPromise;
        }

        renderFallback();
        loadCafe24SubCategories();

        if (window.MutationObserver && sourceList.dataset.ppAllMenuObserved !== "true") {
          sourceList.dataset.ppAllMenuObserved = "true";
          new MutationObserver(renderFallback).observe(sourceList, { childList: true });
        }

        if (allMenuItem && allMenuItem.dataset.ppCategoryRefreshBound !== "true") {
          allMenuItem.dataset.ppCategoryRefreshBound = "true";
          allMenuItem.addEventListener("mouseenter", loadCafe24SubCategories);
          allMenuItem.addEventListener("focusin", loadCafe24SubCategories);
        }
      }

      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", buildAllCategoryMenu);
      } else {
        buildAllCategoryMenu();
      }
    }());
  </script>
</header>
