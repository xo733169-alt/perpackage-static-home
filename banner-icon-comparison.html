<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Perpackage banner and icon preview</title>
  <style>
    :root { --navy:#183f83; --ink:#0b2347; --muted:#667893; --line:#e1e8f0; }
    * { box-sizing:border-box; }
    body { margin:0; background:#fff; color:var(--ink); font-family:"Pretendard","Noto Sans KR",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    a { color:inherit; text-decoration:none; } button { font:inherit; }
    .pp-frame { width:min(1480px,calc(100% - 48px)); margin:0 auto; }
    .pp-top { height:34px; border-bottom:1px solid var(--line); background:#f5f7fa; }
    .pp-top .pp-frame { display:flex; align-items:center; justify-content:space-between; height:100%; color:#657893; font-size:12px; }
    .pp-social,.pp-utility { display:flex; gap:10px; }.pp-social span { display:grid; width:19px; height:19px; place-items:center; border:1px solid #dbe2ea; border-radius:50%; background:#fff; font-size:10px; font-weight:700; }
    .pp-header { border-bottom:1px solid var(--line); background:#fff; }.pp-mainhead { display:grid; grid-template-columns:185px minmax(360px,650px) 1fr; align-items:center; gap:34px; min-height:104px; }
    .pp-logo { color:var(--navy); font-size:27px; font-weight:800; }.pp-logo small { display:block; margin-top:2px; font-size:8px; letter-spacing:.16em; }
    .pp-search { display:flex; height:48px; overflow:hidden; border:1.5px solid var(--navy); border-radius:6px; background:#fff; }.pp-search input { min-width:0; flex:1; border:0; outline:0; padding:0 18px; font:inherit; font-size:14px; }.pp-search button { width:58px; border:0; border-left:1px solid #dce4ef; background:#fff; color:var(--navy); font-size:26px; }
    .pp-actions { display:flex; justify-content:flex-end; gap:22px; }.pp-action { display:grid; min-width:48px; justify-items:center; gap:6px; color:var(--navy); font-size:11px; font-weight:700; }.pp-action b { display:grid; width:29px; height:29px; place-items:center; border:1.5px solid #4164a2; border-radius:8px; font-size:14px; }
    .pp-nav { border-top:1px solid #f5f6f8; border-bottom:1px solid var(--line); }.pp-nav .pp-frame { display:flex; min-height:52px; align-items:center; gap:27px; overflow-x:auto; white-space:nowrap; font-size:14px; font-weight:700; }.pp-nav a:first-child,.pp-nav .pp-guide { color:var(--navy); }.pp-guide { margin-left:auto; }
    .pp-tabbar { border-bottom:1px solid var(--line); background:#fff; }.pp-tabbar .pp-frame { display:flex; gap:10px; overflow-x:auto; padding:18px 0; }.pp-tab { flex:0 0 auto; min-width:142px; padding:10px 18px; border:1px solid #cfd9e8; border-radius:999px; background:#fff; color:#536780; font-weight:700; font-size:14px; cursor:pointer; }.pp-tab:hover,.pp-tab[aria-selected="true"] { border-color:var(--navy); background:var(--navy); color:#fff; }
    .pp-stage { padding:30px 0 0; overflow:hidden; }.pp-hero { overflow:hidden; }.pp-hero-track { display:flex; width:max-content; gap:18px; transition:transform .32s ease; }.pp-banner { display:grid; width:800px; height:430px; grid-template-columns:43% 57%; overflow:hidden; border-radius:9px; background:#e8f2ff; }.pp-banner--warm { background:#fff4d5; }.pp-banner--peach { background:#fff0ea; }.pp-copy { display:flex; flex-direction:column; justify-content:center; padding:40px 30px; }.pp-copy em { align-self:flex-start; margin-bottom:17px; padding:6px 10px; border-radius:4px; background:rgba(255,255,255,.88); color:var(--navy); font-size:12px; font-style:normal; font-weight:700; }.pp-copy h1 { margin:0; font-size:35px; line-height:1.2; }.pp-copy p { margin:18px 0 0; color:#3e557b; font-size:14px; line-height:1.72; }.pp-banner img { width:100%; height:100%; object-fit:cover; }
    .pp-mode[data-banner="small"] .pp-banner { width:590px; height:280px; grid-template-columns:44% 56%; }.pp-mode[data-banner="small"] .pp-copy { padding:25px 22px; }.pp-mode[data-banner="small"] .pp-copy em { margin-bottom:10px; padding:5px 8px; font-size:10px; }.pp-mode[data-banner="small"] .pp-copy h1 { font-size:27px; }.pp-mode[data-banner="small"] .pp-copy p { margin-top:12px; font-size:12px; line-height:1.55; }
    .pp-controls { display:flex; align-items:center; justify-content:center; gap:10px; padding:18px 0 28px; }.pp-control { display:grid; width:40px; height:40px; place-items:center; border:1px solid #d7e0eb; border-radius:7px; background:#fff; color:var(--navy); font-size:25px; cursor:pointer; }.pp-progress { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; width:620px; }.pp-progress span { padding:10px 16px; border-radius:999px; background:#b7beca; color:#fff; text-align:center; font-size:14px; font-weight:700; }.pp-progress .is-active { background:#252c38; }
    .pp-icons { padding:28px 0 42px; border-top:1px solid var(--line); }.pp-icons__title { display:flex; align-items:baseline; justify-content:space-between; gap:18px; margin-bottom:18px; }.pp-icons__title h2 { margin:0; font-size:24px; }.pp-icons__title p { margin:0; color:var(--muted); font-size:14px; }.pp-strip-wrap { position:relative; }.pp-strip { display:grid; grid-auto-flow:column; grid-auto-columns:170px; align-items:start; gap:20px; overflow-x:auto; padding:18px 24px; scroll-behavior:smooth; scroll-snap-type:x proximity; scrollbar-width:none; }.pp-strip::-webkit-scrollbar { display:none; }.pp-strip-card { display:grid; min-height:232px; grid-template-rows:170px auto; align-content:start; justify-items:center; gap:12px; scroll-snap-align:start; background:#fff; }.pp-strip-card strong,.pp-card strong { position:relative; z-index:2; display:block; padding:3px 8px; background:#fff; color:var(--ink); font-size:14px; line-height:1.35; white-space:nowrap; }.pp-real-icon { display:grid; width:150px; height:170px; place-items:center; }.pp-real-icon img { width:150px; height:150px; object-fit:contain; transform:scale(1.3); }.pp-real-icon img[data-kind="ready"] { transform:scale(1.2); }.pp-real-icon img[data-kind="custom"] { transform:scale(1.46); }.pp-strip-nav { display:flex; justify-content:flex-end; gap:8px; margin:-50px 0 12px; }.pp-strip-nav button { width:38px; height:38px; border:1px solid #d7e0eb; border-radius:7px; background:#fff; color:var(--navy); font-size:22px; cursor:pointer; }
    .pp-icon-grid { display:none; grid-template-columns:repeat(5,minmax(0,1fr)); gap:16px; }.pp-mode[data-icons="card"] .pp-strip-wrap { display:none; }.pp-mode[data-icons="card"] .pp-icon-grid { display:grid; }.pp-card { display:grid; min-height:246px; grid-template-rows:184px auto; align-content:start; justify-items:center; gap:12px; overflow:hidden; border:1px solid var(--line); border-radius:9px; background:#fff; transition:transform .2s ease,border-color .2s ease; }.pp-card:hover { border-color:#90a8d0; transform:translateY(-3px); }.pp-card strong { font-size:15px; }
    /* Banner 1 horizontal: keep the shortcuts direct and scrollable. */
    .pp-mode[data-banner="wide"][data-icons="strip"] .pp-icons__title,
    .pp-mode[data-banner="wide"][data-icons="strip"] .pp-strip-nav { display:none; }
    .pp-mode[data-banner="wide"][data-icons="strip"] .pp-strip { padding:8px 24px 14px; scrollbar-width:thin; scrollbar-color:#8ea2c4 #edf1f6; }
    .pp-mode[data-banner="wide"][data-icons="strip"] .pp-strip::-webkit-scrollbar { display:block; height:9px; }
    .pp-mode[data-banner="wide"][data-icons="strip"] .pp-strip::-webkit-scrollbar-track { background:#edf1f6; border-radius:999px; }
    .pp-mode[data-banner="wide"][data-icons="strip"] .pp-strip::-webkit-scrollbar-thumb { background:#8ea2c4; border-radius:999px; }
    @media (min-width:1600px) { .pp-frame { width:1480px; margin-left:calc((100vw - 1919px) / 2 + 215px); margin-right:auto; } }
    @media (max-width:980px) { .pp-mainhead { grid-template-columns:150px 1fr; gap:20px; }.pp-actions { display:none; }.pp-icon-grid { grid-template-columns:repeat(3,minmax(0,1fr)); } }
    @media (max-width:650px) { .pp-frame { width:calc(100% - 28px); margin:0 auto; }.pp-top { display:none; }.pp-mainhead { grid-template-columns:1fr; gap:14px; min-height:auto; padding:20px 0; }.pp-nav .pp-frame { gap:20px; min-height:46px; }.pp-tabbar .pp-frame { padding:12px 0; }.pp-tab { min-width:130px; }.pp-stage { padding-top:18px; }.pp-banner,.pp-mode[data-banner="small"] .pp-banner { width:calc(100vw - 28px); height:260px; grid-template-columns:49% 51%; }.pp-copy,.pp-mode[data-banner="small"] .pp-copy { padding:20px; }.pp-copy h1,.pp-mode[data-banner="small"] .pp-copy h1 { font-size:25px; }.pp-copy p,.pp-mode[data-banner="small"] .pp-copy p { margin-top:12px; font-size:12px; }.pp-copy em,.pp-mode[data-banner="small"] .pp-copy em { margin-bottom:10px; font-size:10px; }.pp-progress { width:calc(100vw - 134px); }.pp-progress span { padding:9px 6px; font-size:12px; }.pp-icons { padding:24px 0 30px; }.pp-icons__title { display:block; }.pp-icons__title p { margin-top:7px; }.pp-icon-grid { grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; }.pp-card { min-height:190px; }.pp-real-icon { width:126px; height:126px; }.pp-real-icon img { width:118px; height:118px; }.pp-strip { grid-auto-columns:130px; gap:10px; }.pp-strip-card { min-height:176px; }.pp-strip-nav { margin-top:8px; } }
  </style>
</head>
