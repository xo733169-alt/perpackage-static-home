<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- 광고 전용 랜딩페이지: 검색엔진 노출 방지 -->
  <meta name="robots" content="noindex, nofollow" />

  <title>소량 맞춤 패키지 제작 상담 | 페르패키지</title>
  <meta name="description" content="단상자, 싸바리, 쇼핑백, 스티커, 샘플 제작까지 소량 맞춤 패키지 제작 상담을 도와드립니다." />

  <style>
    :root {
      --navy: #2A408C;
      --navy-dark: #1f316d;
      --bg: #f7f8fc;
      --white: #ffffff;
      --text: #111827;
      --muted: #6b7280;
      --line: #e5e7eb;
      --soft-blue: #eef3ff;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      color: var(--text);
      background: var(--bg);
      line-height: 1.6;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .landing-wrap {
      width: 100%;
      min-height: 100vh;
      overflow: hidden;
      background: #ffffff;
    }

    .landing-visual {
      width: 100%;
      background: #ffffff;
    }

    .landing-visual img {
      display: block;
      width: 100%;
      max-width: 1440px;
      height: auto;
      margin: 0 auto;
    }

    .container {
      width: min(1120px, calc(100% - 40px));
      margin: 0 auto;
    }

    /* 상단 */
    .top-bar {
      background: rgba(255, 255, 255, 0.96);
      border-bottom: 1px solid var(--line);
      position: sticky;
      top: 0;
      z-index: 20;
      backdrop-filter: blur(10px);
    }

    .top-bar-inner {
      height: 72px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      font-size: 23px;
      font-weight: 900;
      letter-spacing: -0.05em;
      color: var(--navy);
    }

    .top-note {
      color: var(--muted);
      font-size: 14px;
      letter-spacing: -0.03em;
    }

    /* 히어로 */
    .hero {
      background: linear-gradient(135deg, #ffffff 0%, #eef3ff 100%);
      padding: 74px 0 64px;
    }

    .hero-grid {
      display: grid;
      grid-template-columns: 1.08fr 0.92fr;
      gap: 48px;
      align-items: center;
    }

    .hero-badge {
      display: inline-flex;
      align-items: center;
      padding: 8px 14px;
      border-radius: 999px;
      background: var(--soft-blue);
      color: var(--navy);
      font-size: 14px;
      font-weight: 800;
      margin-bottom: 18px;
    }

    .hero-title {
      margin: 0;
      font-size: clamp(34px, 5vw, 56px);
      line-height: 1.14;
      letter-spacing: -0.07em;
      color: #111827;
    }

    .hero-title strong {
      color: var(--navy);
    }

    .hero-desc {
      margin: 24px 0 0;
      font-size: 18px;
      color: #4b5563;
      letter-spacing: -0.035em;
    }

    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 34px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 52px;
      padding: 0 24px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 900;
      letter-spacing: -0.03em;
      transition: transform 0.15s ease, background 0.15s ease;
    }

    .btn:hover {
      transform: translateY(-1px);
    }

    .btn-primary {
      background: var(--navy);
      color: var(--white);
    }

    .btn-primary:hover {
      background: var(--navy-dark);
    }

    .btn-secondary {
      background: var(--white);
      color: var(--navy);
      border: 1px solid #cbd5e1;
    }

    .hero-note {
      margin-top: 16px;
      font-size: 14px;
      color: var(--muted);
      letter-spacing: -0.03em;
    }

    .hero-image {
      min-height: 380px;
      border-radius: 28px;
      background:
        linear-gradient(rgba(42, 64, 140, 0.08), rgba(42, 64, 140, 0.08)),
        url("https://via.placeholder.com/900x680?text=PerPackage+Landing+Image") center / cover no-repeat;
      box-shadow: 0 24px 70px rgba(42, 64, 140, 0.18);
      position: relative;
    }

    .hero-floating-card {
      position: absolute;
      left: 24px;
      bottom: 24px;
      background: rgba(255,255,255,0.94);
      border: 1px solid rgba(229,231,235,0.9);
      border-radius: 18px;
      padding: 18px 20px;
      box-shadow: 0 16px 40px rgba(15,23,42,0.12);
    }

    .hero-floating-card b {
      display: block;
      color: var(--navy);
      font-size: 18px;
      letter-spacing: -0.04em;
    }

    .hero-floating-card span {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 14px;
    }

    /* 공통 섹션 */
    .section {
      padding: 76px 0;
    }

    .section.white {
      background: var(--white);
    }

    .section.soft {
      background: #f8fbff;
    }

    .section-head {
      text-align: center;
      margin-bottom: 36px;
    }

    .section-kicker {
      color: var(--navy);
      font-size: 14px;
      font-weight: 900;
      letter-spacing: -0.02em;
      margin-bottom: 8px;
    }

    .section-title {
      margin: 0;
      font-size: clamp(26px, 3vw, 38px);
      line-height: 1.25;
      letter-spacing: -0.06em;
      color: #111827;
    }

    .section-desc {
      margin: 14px auto 0;
      max-width: 660px;
      color: var(--muted);
      font-size: 16px;
      letter-spacing: -0.03em;
    }

    /* 카드 */
    .card-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
    }

    .card {
      background: var(--white);
      border: 1px solid var(--line);
      border-radius: 22px;
      padding: 26px;
      box-shadow: 0 12px 34px rgba(15, 23, 42, 0.05);
    }

    .card-icon {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      background: var(--soft-blue);
      color: var(--navy);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      margin-bottom: 16px;
    }

    .card-title {
      margin: 0;
      font-size: 19px;
      font-weight: 900;
      letter-spacing: -0.04em;
      color: #111827;
    }

    .card-text {
      margin: 10px 0 0;
      color: var(--muted);
      font-size: 15px;
      letter-spacing: -0.03em;
    }

    /* 이미지 섹션 */
    .image-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
    }

    .image-card {
      overflow: hidden;
      border-radius: 24px;
      background: var(--white);
      border: 1px solid var(--line);
      box-shadow: 0 12px 34px rgba(15, 23, 42, 0.06);
    }

    .image-card img {
      width: 100%;
      aspect-ratio: 4 / 3;
      object-fit: cover;
      display: block;
    }

    .image-card-body {
      padding: 18px 20px 22px;
    }

    .image-card-body b {
      display: block;
      font-size: 17px;
      letter-spacing: -0.04em;
      color: #111827;
    }

    .image-card-body p {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 14px;
      letter-spacing: -0.03em;
    }

    /* 준비사항 */
    .check-list {
      max-width: 820px;
      margin: 0 auto;
      background: var(--white);
      border: 1px solid var(--line);
      border-radius: 24px;
      padding: 28px;
      box-shadow: 0 12px 34px rgba(15, 23, 42, 0.05);
    }

    .check-item {
      display: flex;
      gap: 14px;
      padding: 16px 0;
      border-bottom: 1px solid var(--line);
    }

    .check-item:last-child {
      border-bottom: 0;
    }

    .check-mark {
      flex: 0 0 28px;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--navy);
      color: var(--white);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 900;
      margin-top: 1px;
    }

    .check-content b {
      display: block;
      font-size: 16px;
      color: #111827;
      letter-spacing: -0.04em;
    }

    .check-content span {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 14px;
      letter-spacing: -0.03em;
    }

    /* Vercel 홈페이지와 같은 방식의 플러그 문의폼 섹션 */
    .perpackage-pluuug-form {
      background:
        linear-gradient(180deg, #f8fbff 0%, #ffffff 100%);
      padding: 88px 0 110px;
    }

    .perpackage-pluuug-form__inner {
      width: min(1120px, calc(100% - 40px));
      margin: 0 auto;
    }

    .perpackage-pluuug-form__header {
      text-align: center;
      margin-bottom: 26px;
    }

    .perpackage-pluuug-form__eyebrow {
      margin: 0 0 8px;
      color: var(--navy);
      font-size: 14px;
      font-weight: 900;
      letter-spacing: -0.02em;
    }

    .perpackage-pluuug-form__header h2 {
      margin: 0;
      color: #111827;
      font-size: clamp(30px, 4vw, 44px);
      line-height: 1.22;
      letter-spacing: -0.07em;
    }

    .perpackage-pluuug-form__header p {
      margin: 14px auto 0;
      max-width: 720px;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.7;
      letter-spacing: -0.03em;
    }

    .perpackage-pluuug-form__notice {
      max-width: 820px;
      margin: 0 auto 28px;
      padding: 15px 20px;
      border-radius: 14px;
      background: var(--soft-blue);
      color: var(--navy);
      font-size: 14px;
      font-weight: 800;
      text-align: center;
      letter-spacing: -0.03em;
    }

    .perpackage-pluuug-form__frame {
      width: 100%;
      max-width: 1080px;
      margin: 0 auto;
      background: #ffffff;
      border: 1px solid #dbe3ef;
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 22px 70px rgba(15, 23, 42, 0.12);
    }

    .perpackage-pluuug-form__frame iframe {
      display: block;
      width: 100%;
      height: 1300px;
      min-height: 1300px;
      border: 0;
      background: #ffffff;
    }

    .perpackage-pluuug-form__fallback {
      margin: 18px 0 0;
      text-align: center;
      color: var(--muted);
      font-size: 14px;
      letter-spacing: -0.03em;
    }

    .perpackage-pluuug-form__fallback a {
      color: var(--navy);
      font-weight: 900;
      text-decoration: underline;
    }

    /* 하단 고정 버튼 */
    .sticky-cta {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 50;
      background: rgba(255,255,255,0.96);
      border-top: 1px solid var(--line);
      padding: 10px 14px;
      display: none;
    }

    .sticky-cta .btn {
      width: 100%;
      min-height: 50px;
    }

    /* 푸터 */
    .footer {
      background: #0b1220;
      color: rgba(255,255,255,0.74);
      padding: 30px 0 90px;
      text-align: center;
      font-size: 13px;
      letter-spacing: -0.03em;
    }

    .footer strong {
      color: #ffffff;
    }

    @media (max-width: 900px) {
      .container {
        width: min(100% - 28px, 1120px);
      }

      .top-bar-inner {
        height: 64px;
      }

      .top-note {
        display: none;
      }

      .hero {
        padding: 48px 0 42px;
      }

      .hero-grid {
        grid-template-columns: 1fr;
        gap: 32px;
      }

      .hero-desc {
        font-size: 16px;
      }

      .hero-actions .btn {
        width: 100%;
      }

      .hero-image {
        min-height: 280px;
        border-radius: 22px;
      }

      .hero-floating-card {
        left: 16px;
        right: 16px;
        bottom: 16px;
      }

      .card-grid,
      .image-grid {
        grid-template-columns: 1fr;
      }

      .section {
        padding: 56px 0;
      }

      .perpackage-pluuug-form {
        padding: 58px 0 86px;
      }

      .perpackage-pluuug-form__inner {
        width: min(100% - 24px, 1120px);
      }

      .perpackage-pluuug-form__frame {
        border-radius: 18px;
      }

      .perpackage-pluuug-form__frame iframe {
        height: 1200px;
        min-height: 1200px;
      }

      .sticky-cta {
        display: block;
      }
    }
  </style>
</head>

<body>
  <main class="landing-wrap">

    <!-- 상단: 메뉴 없이 로고만 노출 -->
    <header class="top-bar">
      <div class="container top-bar-inner">
        <a href="/" class="logo" aria-label="페르패키지 홈으로 이동">페르패키지</a>
        <div class="top-note">맞춤 패키지 제작 상담</div>
      </div>
    </header>

    <!-- 회사 소개 랜딩 이미지: Vercel 정적 자산을 Cafe24에서 절대 URL로 호출 -->
    <section class="landing-visual" aria-label="페르패키지 회사 소개">
      <img
        src="https://perpackage-main-public.vercel.app/assets/landing/company-landing-20260716.png"
        alt="페르패키지 제작 사례와 패키지 종류 및 제작 공정을 소개하는 회사 안내"
        width="1440"
        height="19178"
        loading="eager"
        fetchpriority="high"
      />
    </section>


    <!-- 문의폼: Vercel 홈페이지와 같은 iframe 직접 삽입 방식 -->
    <section class="perpackage-pluuug-form" id="inquiry-form">
      <div class="perpackage-pluuug-form__inner">
        <div class="perpackage-pluuug-form__header">
          <p class="perpackage-pluuug-form__eyebrow">견적문의</p>
          <h2>패키지 제작 문의를 남겨주세요</h2>
          <p>
            아래 문의폼을 작성해주시면 확인 후 상담을 도와드리겠습니다.
          </p>
        </div>

        <div class="perpackage-pluuug-form__notice">
          최종 견적은 사양 확인 후 확정되며, 재고와 납기는 상담 후 안내됩니다.
        </div>

        <div class="perpackage-pluuug-form__frame">
          <iframe
            src="https://www.pluuug.com/form/TrPLMjXdJ1"
            title="페르패키지 견적문의 폼"
            loading="lazy"
            width="100%"
            height="1300"
            style="border:0;"
          ></iframe>
        </div>

        <p class="perpackage-pluuug-form__fallback">
          폼이 보이지 않는다면
          <a href="https://www.pluuug.com/form/TrPLMjXdJ1" target="_blank" rel="noopener noreferrer">
            새 창에서 견적문의 작성하기
          </a>
        </p>
      </div>
    </section>

    <!-- 푸터 -->
    <footer class="footer">
      <div class="container">
        <strong>페르패키지</strong><br />
        맞춤 패키지 제작 상담 · 단상자 · 싸바리 · 쇼핑백 · 스티커 · 샘플 제작
      </div>
    </footer>

    <!-- 모바일 하단 고정 문의 버튼 -->
    <div class="sticky-cta">
      <a href="#inquiry-form" class="btn btn-primary">제작 상담 문의하기</a>
    </div>

  </main>
</body>
</html>
